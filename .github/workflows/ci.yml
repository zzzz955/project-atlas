# 🔴 PARTIALLY VERIFIED - and every verified run so far FAILED.
# History (architecture-design.md §15.5 has the full logs and the dependency-tree measurement):
#   run 31142102019 : failed at `configure` - github.com/boostorg/polygon 500 + an ncurses hash
#                     mismatch, both pulled in by libmysql (92 transitive ports)
#   re-run          : failed at `configure` again, at a DIFFERENT port (boostorg/core 500)
# Two different ports failing is the evidence that this is structural (~100 ports source-built every
# run, no binary cache, no retry layer), not a flake. This revision fixes the cache and the retry;
# 🔴 server/vcpkg.json is deliberately untouched (6 deps, §15.2).
#
# Everything after `configure` - format-check, clang-tidy, the two builds, ctest - has still never
# executed on a runner. `server/scripts/ci-gate.ps1` remains the gate that is actually exercised.
#
# Gate order is architecture-design.md §15.4:
#   gen:check -> core-purity -> format-check -> clang-tidy -> build(unity ON) -> build(unity OFF)
#   -> test
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      # vcpkg's own GitHub Actions binary cache. It replaces the cache-action step that used to
      # wrap ~/.cache/vcpkg/archives and never filled: the first run missed and then died in
      # `configure`, so the post-job save never stored a usable archive set (§15.5).
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # 🔴 Mechanical enforcement of "never edit generated output": if server/generated/** does not
      # match what the generators produce from the current inputs, the gate stops here.
      - name: gen:check (generated-output drift)
        run: npm run gen:check

      # 🔴 Mechanical enforcement of "the core must not know the game" (§14, §15.4). Same Node
      # checker server/scripts/ci-gate.ps1 runs - one implementation, two callers.
      - name: core-purity (core must not know the game)
        run: npm run check:core-purity

      # clang-tidy's ExcludeHeaderFilterRegex (used by .clang-tidy to skip generated/) requires
      # clang-tidy >= 19 - below that the key is silently ignored. cpp-style.md §7.1.
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format-19 clang-tidy-19 \
            pkg-config curl zip unzip tar
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-19 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-19 100

      # The x-gha backend talks to the Actions cache service and needs ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN, which are NOT exported to plain `run:` steps. This github-script
      # export is the form vcpkg documents for GitHub Actions.
      - name: export GitHub Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git server/vcpkg
          server/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # Configure both trees first: clang-tidy needs the compile_commands.json that only a
      # configured Ninja tree emits.
      #
      # 🔴 Retried up to 3 times with exponential backoff, because a single upstream 500 out of
      # ~100 source-built ports killed both previous runs (§15.5). 🔴 This is a bounded retry, not
      # a loop that runs until it succeeds - after attempt 3 the step fails and the gate fails.
      # 🔴 Every swallowed failure is printed (attempt number + which cmake preset died), so a run
      # that only passes on attempt 3 cannot be mistaken for a healthy one.
      - name: configure (retry x3)
        working-directory: server
        run: |
          set -u
          attempt=1
          max=3
          while true; do
            echo "::group::configure attempt ${attempt}/${max}"
            failed=''
            cmake --preset linux-release || failed='linux-release'
            if [ -z "${failed}" ]; then
              cmake --preset linux-ci || failed='linux-ci'
            fi
            echo "::endgroup::"

            if [ -z "${failed}" ]; then
              if [ "${attempt}" -gt 1 ]; then
                echo "configure succeeded on attempt ${attempt} - earlier attempts failed, see the groups above."
              fi
              break
            fi

            echo "configure attempt ${attempt}/${max} FAILED at preset '${failed}'."
            if [ "${attempt}" -ge "${max}" ]; then
              echo "configure failed ${max}/${max} times - failing the gate."
              exit 1
            fi
            backoff=$((15 * attempt * attempt))
            echo "retrying in ${backoff}s"
            sleep "${backoff}"
            attempt=$((attempt + 1))
          done

      - name: format-check
        run: clang-format --style=file --dry-run -Werror $(find server/atlas server/tests -name '*.h' -o -name '*.cpp')

      # 🔴 This job is the ONLY place clang-tidy is enforced. server/scripts/ci-gate.ps1 skips it:
      # clang-tidy cannot read the MSVC /Yc precompiled header that the local Ninja/cl tree emits.
      # Here clang produces both the compile database and the PCH, so the step is sound.
      # cpp-style.md §7.3 · architecture-design.md §15.4.
      - name: clang-tidy
        run: clang-tidy -p server/build/linux-ci --warnings-as-errors='*' --quiet $(find server/atlas server/tests -name '*.cpp')

      - name: build (unity ON)
        working-directory: server
        run: cmake --build --preset linux-release

      # 🔴 The gate that catches missing #includes and ODR collisions (§15.1, cost 4).
      - name: build (unity OFF)
        working-directory: server
        run: cmake --build --preset linux-ci

      - name: test
        working-directory: server
        run: ctest --preset linux-ci --output-on-failure

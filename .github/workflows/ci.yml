# ✅ GREEN since run 31358038029 (2026-08-10, `6fa57c9`) - all 7 gate steps pass in 7m04s.
# 🔴 Do NOT read that as "CI is settled": the three failures below took three separate fixes, and
# every one of them was a wrong diagnosis on the first try. Full logs and measurements are in
# architecture-design.md §15.5 / §15.5a / §15.5b / §15.5c / §15.5d.
#
# History:
#   run 31142102019 : failed at `configure` - github.com/boostorg/polygon 500 + an ncurses hash
#                     mismatch, both pulled in by libmysql (92 transitive ports)
#   re-run          : failed at `configure` again, at a DIFFERENT port (boostorg/core 500)
#   run 31153396554 : failed at `configure` a THIRD time, and this one was NOT a flake -
#                     `Could not find rpc/rpc.h` (libmysql's cmake/rpc.cmake). ubuntu-24.04 dropped
#                     the Sun RPC headers from glibc; libmysql needs libtirpc-dev.
#                     🔴 server/Dockerfile already installed libtirpc-dev and said why - this file
#                     never learned it. The two Linux build recipes had drifted.
# Three failures, three different causes, one common source: libmysql. §15.5a (2026-08-10) swaps the
# DB client to `libmariadb` (92 transitive ports -> 4). Dep count is still 6 (§15.2).
#
# 🔴 THE BINARY CACHE HAD NEVER WORKED until 2026-08-10. Measured on run 31153396554 (§15.5b):
# vcpkg printed "The 'x-gha' binary caching backend has been removed" and carried on with NO cache
# at all - `clear;` had also disabled the default local one. Timings from that run: attempt 1 =
# 9m18s (102 ports built from source), attempts 2 and 3 = ~21s each (they reused the on-disk tree,
# not a cache). Replaced with the `files` backend wrapped in actions/cache; the first green run
# stored 38 MB (§15.5c).
#
# 🔴 The bottleneck MOVES once that cache is warm. On the first green run `configure` was 3m46s
# (cache miss) and `clang-tidy` 2m16s; from the second run on, configure collapses and clang-tidy
# is the largest step in the gate. That is why clang-tidy is fanned out per file below (§15.5d).
#
# Gate order is architecture-design.md §15.4:
#   gen:check -> core-purity -> format-check -> clang-tidy -> build(unity ON) -> build(unity OFF)
#   -> test
name: ci

on:
  push:
  pull_request:

# 🔴 A superseded run is wasted runner time and a misleading red X on an old commit. Only the newest
# push per ref survives. Never add `cancel-in-progress` to a deploy workflow - here nothing is
# deployed, so cancelling is free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      # 🔴 NOT x-gha - that backend was removed from vcpkg and silently did nothing (§15.5b).
      # The `files` backend writes real archives to a directory, and actions/cache carries that
      # directory between runs.
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'
    steps:
      # fetch-depth 0: the docs-only skip below diffs github.event.before..GITHUB_SHA, which needs
      # both commits present. This repo is small enough that a full fetch is cheap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔴 Decides whether the C++ half of the gate runs at all. A docs-only push does not need a
      # 60-port vcpkg install to prove anything.
      # 🔴 FAILS SAFE: force push, first push, shallow history, or any pull_request event -> the
      # base commit is unusable, so we run EVERYTHING. A skip gate that guesses wrong is worse than
      # no skip gate, because it reports green for code nobody compiled.
      - name: decide whether C++ steps run
        id: scope
        run: |
          set -u
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "${base}" ] \
             || [ "${base}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "reason=base commit unusable (${{ github.event_name }}) - running everything"
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          echo "changed files:"
          echo "${changed}"
          # Anything outside docs/ counts as C++-relevant. Deliberately conservative: a change to
          # .github/, tools/, package.json or server/ all force the full gate.
          if printf '%s\n' "${changed}" | grep -qvE '^docs/'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only push - skipping the C++ half of the gate"
            echo "cpp=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # 🔴 Mechanical enforcement of "never edit generated output": if server/generated/** does not
      # match what the generators produce from the current inputs, the gate stops here.
      # 🔴 This one runs on EVERY push, docs-only included - the drift it guards against is cheap to
      # check and expensive to miss.
      - name: gen:check (generated-output drift)
        run: npm run gen:check

      # 🔴 Mechanical enforcement of "the core must not know the game" (§14, §15.4). Same Node
      # checker server/scripts/ci-gate.ps1 runs - one implementation, two callers.
      - name: core-purity (core must not know the game)
        run: npm run check:core-purity

      # ---------------------------------------------------------------- C++ half (skippable)

      # clang-tidy's ExcludeHeaderFilterRegex (used by .clang-tidy to skip generated/) requires
      # clang-tidy >= 19 - below that the key is silently ignored. cpp-style.md §7.1.
      - name: install toolchain
        if: steps.scope.outputs.cpp == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format-19 clang-tidy-19 \
            pkg-config curl zip unzip tar
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-19 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-19 100

      # The cache key has to change when the port set changes AND when the port tree changes.
      # vcpkg.json carries both: the dependency list and the builtin-baseline SHA that pins the tree.
      - name: compute vcpkg cache key
        if: steps.scope.outputs.cpp == 'true'
        id: vcpkgkey
        run: |
          set -eu
          baseline="$(node -p "require('./server/vcpkg.json')['builtin-baseline']")"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "key=vcpkg-x64-linux-${baseline}-${{ hashFiles('server/vcpkg.json') }}" >> "$GITHUB_OUTPUT"

      # 🔴 restore and save are SPLIT on purpose. The combined actions/cache action only saves when
      # the job succeeds, which is exactly why the previous attempt never filled: the run died in
      # `configure` every time, so nothing was ever stored and the next run started from zero again
      # (§15.5). With a `save` guarded by `if: always()`, even a failed run banks the ports it did
      # manage to build, and the cache fills across attempts instead of never.
      - name: restore vcpkg binary cache
        if: steps.scope.outputs.cpp == 'true'
        id: vcpkgcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkgkey.outputs.key }}
          restore-keys: |
            vcpkg-x64-linux-${{ steps.vcpkgkey.outputs.baseline }}-
            vcpkg-x64-linux-

      # 🔴 The clone is pinned to the SAME commit as vcpkg.json's builtin-baseline. Cloning master
      # meant the port tree drifted from the pinned baseline between runs, which both weakened
      # reproducibility (§15.2's whole point) and made the cache key describe something that was no
      # longer true.
      - name: bootstrap vcpkg
        if: steps.scope.outputs.cpp == 'true'
        run: |
          set -eu
          mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git server/vcpkg
          git -C server/vcpkg checkout --detach "${{ steps.vcpkgkey.outputs.baseline }}"
          server/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      # Configure both trees first: clang-tidy needs the compile_commands.json that only a
      # configured Ninja tree emits.
      #
      # 🔴 Both presets now share one VCPKG_INSTALLED_DIR (CMakePresets.json), so the ~60 ports are
      # installed ONCE instead of once per preset. Unity build is a compiler setting and does not
      # change a single dependency, so the two trees were always installing identical port sets.
      #
      # 🔴 Retried up to 3 times with exponential backoff, because a single upstream 500 out of the
      # source-built ports killed two earlier runs (§15.5). 🔴 This is a bounded retry, not a loop
      # that runs until it succeeds - after attempt 3 the step fails and the gate fails.
      # 🔴 Every swallowed failure is printed (attempt number + which cmake preset died), so a run
      # that only passes on attempt 3 cannot be mistaken for a healthy one.
      - name: configure (retry x3)
        if: steps.scope.outputs.cpp == 'true'
        working-directory: server
        run: |
          set -u
          attempt=1
          max=3
          while true; do
            echo "::group::configure attempt ${attempt}/${max}"
            failed=''
            cmake --preset linux-release || failed='linux-release'
            if [ -z "${failed}" ]; then
              cmake --preset linux-ci || failed='linux-ci'
            fi
            echo "::endgroup::"

            if [ -z "${failed}" ]; then
              if [ "${attempt}" -gt 1 ]; then
                echo "configure succeeded on attempt ${attempt} - earlier attempts failed, see the groups above."
              fi
              break
            fi

            echo "configure attempt ${attempt}/${max} FAILED at preset '${failed}'."
            if [ "${attempt}" -ge "${max}" ]; then
              echo "configure failed ${max}/${max} times - failing the gate."
              exit 1
            fi
            backoff=$((15 * attempt * attempt))
            echo "retrying in ${backoff}s"
            sleep "${backoff}"
            attempt=$((attempt + 1))
          done

      # 🔴 always(): banks whatever was built even when configure died. See the split-cache note
      # above - this single line is the difference between a cache that fills and one that never does.
      # 🔴 Skipped on an EXACT key hit: the entry is already complete for this vcpkg.json+baseline,
      # and re-saving the same key only produces a "another job may be creating this cache" warning
      # on every run - noise that trains you to ignore the cache step's output. A restore-keys
      # (prefix) hit still reports cache-hit == 'false', so a partially-warm run does save.
      - name: save vcpkg binary cache
        if: always() && steps.scope.outputs.cpp == 'true' && steps.vcpkgkey.outputs.key != '' && steps.vcpkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkgkey.outputs.key }}

      - name: format-check
        if: steps.scope.outputs.cpp == 'true'
        run: clang-format --style=file --dry-run -Werror $(find server/atlas server/game server/loadgen server/tests -name '*.h' -o -name '*.cpp')

      # 🔴 This job is the ONLY place clang-tidy is enforced. server/scripts/ci-gate.ps1 skips it:
      # clang-tidy cannot read the MSVC /Yc precompiled header that the local Ninja/cl tree emits.
      # Here clang produces both the compile database and the PCH, so the step is sound.
      # cpp-style.md §7.3 · architecture-design.md §15.4.
      #
      # 🔴 Run one clang-tidy per file across all cores. clang-tidy has no internal parallelism, so
      # the fan-out has to happen here. Measured (§15.5d, §15.5e): 14 TUs serial = 2m16s, fanned out
      # = 1m18s. 🔴 That is 1.74x on a 4-vCPU runner, NOT 4x - a few TUs (the gtest-heavy test
      # translation units) dominate and the other cores idle waiting on that tail. Do not assume
      # core-count speedup for work with uneven per-item cost.
      # 🔴 Still 48% of a warm run. Job sharding was measured and deferred, with an explicit
      # threshold to revisit at: clang-tidy > 3min (~35 TUs). See §15.5e - this repo crosses it.
      # 🔴 xargs exits 123 when ANY invocation fails, so the gate still fails on a single violation -
      # parallelism must not soften the gate. `-n 1` gives each file its own process; the ~0.3s
      # startup is noise against ~10s of analysis, and per-file processes keep each diagnostic
      # attributable when the streams interleave.
      - name: clang-tidy
        if: steps.scope.outputs.cpp == 'true'
        run: |
          find server/atlas server/game server/loadgen server/tests -name '*.cpp' -print0 \
            | xargs -0 -P "$(nproc)" -n 1 \
                clang-tidy -p server/build/linux-ci --warnings-as-errors='*' --quiet

      - name: build (unity ON)
        if: steps.scope.outputs.cpp == 'true'
        working-directory: server
        run: cmake --build --preset linux-release

      # 🔴 The gate that catches missing #includes and ODR collisions (§15.1, cost 4).
      - name: build (unity OFF)
        if: steps.scope.outputs.cpp == 'true'
        working-directory: server
        run: cmake --build --preset linux-ci

      - name: test
        if: steps.scope.outputs.cpp == 'true'
        working-directory: server
        run: ctest --preset linux-ci --output-on-failure

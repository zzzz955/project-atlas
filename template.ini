; project-atlas 도구 설정. 경로 / 타깃 등 툴링 값만 둔다.
; 🔴 시크릿 금지 — 접속 정보 · 키 · 계정값은 .env 에 두고 커밋하지 않는다(*.example 만 커밋).
; 생성기 3종의 입력:
;   info_generator → shared/datas/**/*.csv
;   db_generator   → server/db/schema.json
;   pkt_generator  → shared/contracts/**/*.cs
; C++ 출력 경로 / 네임스페이스 키는 각 생성기가 붙기 전에 미리 확정해 둔다.

[paths]
datas_dir = shared/datas
server_generated = server/generated

[data-gen]
; CSV 2행의 타깃 표기(C = 클라 전용 / S = 서버 전용 / CS = 공유) 중 서버가 가져갈 것
server_targets = S,CS
cpp_info_output_dir = server/generated/info
cpp_namespace = atlas::generated

[db-gen]
schema = server/db/schema.json
sql_output = server/generated/db/schema.sql
cpp_db_output_dir = server/generated/db
cpp_namespace = atlas::generated

[packet-gen]
contracts_dir = shared/contracts
cpp_output_dir = server/generated/pkt
cpp_namespace = atlas::generated

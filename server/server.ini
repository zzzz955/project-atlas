; project-atlas 서버 런타임 설정. architecture-design.md §5.4
; 🔴 시크릿은 여기 넣지 않는다 — DB 자격증명 · JWKS URL 은 .env 다.

[server]
; 🔴 role 은 런타임 정체성이고, 실행할 바이너리는 .env 의 ATLAS_ROLE 이 고른다(§5.4).
;    둘이 어긋나면 atlas_game 이 기동을 거부한다(exit 64) — 조용히 뜨는 쪽이 더 나쁘다.
role         = game     ; fe | game | world | interworld  (§5.1 / §5.2)
server_id    = 1        ; §6 3계층 식별자의 두 번째 칸. characters PK 의 server_id 와 같은 값이다
world_id     = 0        ; role=world|interworld 일 때만 의미 있음
server_group = 0        ; Phase 3 InterWorld 묶음 단위
listen_port  = 7777     ; GAME 이 수신하는 포트. compose 가 같은 번호를 호스트로 노출한다
io_workers   = 0        ; 0 = hardware_concurrency (§9 wp5 결정 기록과 동일 규약)
; 🔴 DB 커넥션 풀 크기 / DB 스레드 수는 여기 없다. atlas/config 의 타입 있는 ini 뷰가 아직 그
;    키를 읽지 않으므로, 아무도 파싱하지 않는 키를 커밋된 ini 에 넣으면 장식이 된다. 현재 값은
;    game/main.cpp 의 상수이며 ServerConfig 가 읽게 되는 시점에 이 섹션으로 올라온다.

[stack]
; 🔴 축은 존재하고 값은 1개다. 분기 구현은 하지 않는다 — architecture-design.md §14.
; 조합이 2개째 실제로 생기면 stack_generator 로 승격한다.
client = godot
server = cpp-asio
db     = mysql
cache  = none           ; redis 자리 (§10.2)

[log]
level          = info
dir            = logs
retention_days = 14     ; §11.1 확정값
